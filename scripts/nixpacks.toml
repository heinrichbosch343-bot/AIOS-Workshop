# Overrides Nixpacks' auto-detected install, which would otherwise run `pip install -r scripts/requirements.txt`
# (Playwright and its browser download, meant for the dashboards, not for this worker). This service needs only
# the reply agent's own small set of pure-Python packages, pinned to match apps/boschai-backend where both use
# the same library, for one Anthropic SDK version to reason about across the two services.
[phases.setup]
# The auto-detected setup phase for this directory was bare `python3, gcc`,
# whose nix `python3` package ships with no pip at all (confirmed on Railway's
# Metal builder, 20 Oct 2026: "No module named pip" even via `python3 -m pip`).
# Request pip for that same interpreter explicitly.
nixPkgs = ["python3", "python3Packages.pip", "gcc"]

[phases.install]
# Bare `pip`, not `python3 -m pip`: python3Packages.pip is a separate nix
# store path from python3, so `python3 -m pip` can't see it (its sys.path
# comes from python3's own prefix). The `pip` console script nix-env links
# into the shared profile is wrapped with the right path baked in.
cmds = ["pip install --no-cache-dir --break-system-packages fastapi==0.115.5 'uvicorn[standard]'==0.32.1 python-multipart==0.0.17 anthropic==0.40.0 python-dotenv==1.0.1 truststore"]
